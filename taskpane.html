<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Añadir al calendario</title>

    <link rel="stylesheet"
          href="taskpane.css">

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

</head>

<body>

    <div class="container">

        <h1>📅 Añadir al calendario</h1>

        <div id="status" class="status">
            Leyendo el correo...
        </div>

        <div class="field">

            <label>Asunto</label>

            <div id="subject"
                 class="value">
                —
            </div>

        </div>

        <div class="field">

            <label>Remitente</label>

            <div id="sender"
                 class="value">
                —
            </div>

        </div>

        <div class="field">

            <label>Contenido del correo</label>

            <textarea
                id="body"
                readonly>
            </textarea>

        </div>

        <button
            id="analyzeButton"
            class="primary">

            🔎 Analizar evento

        </button>

        <div id="result"
             class="result"
             hidden>

            <h2>Evento detectado</h2>

            <p id="eventResult"></p>

        </div>

    </div>

    <script src="taskpane.js"></script>

</body>

</html>
